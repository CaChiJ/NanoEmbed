# M5 follow-up: cold page cache across batch size and partition strategy.
#
# The warm matrix showed zero major faults, so batching had no first-use I/O
# left to share. This file repeats the same grid against a verified-cold cache,
# where that I/O exists. One fresh worker handles one sub-batch: later items in
# a batch reuse pages the first item faulted in, which is exactly the effect
# layer batching exists to produce.
#
# Batch size 1 reproduces the historical per-item cold shape and acts as the
# control against bench/results/M5-docker-desktop-arm64/cold-b1/.
cold_matrix_base: &cold_matrix_base
  model: models/harrier-270m-q8_0.gguf
  corpus_group: mixed_short
  samples: 132
  normalize: true
  threads: 4
  streaming: true
  cache_state: cold
  milestones: [M5-COLD-MATRIX]

scenarios:
  - <<: *cold_matrix_base
    name: m5_cold_b01_layer
    batch_size: 1
    max_batch: 1
    partition: layer

  - <<: *cold_matrix_base
    name: m5_cold_b01_attn_ffn
    batch_size: 1
    max_batch: 1
    partition: attn-ffn

  - <<: *cold_matrix_base
    name: m5_cold_b01_budget10m
    batch_size: 1
    max_batch: 1
    partition: budget:10485760

  - <<: *cold_matrix_base
    name: m5_cold_b01_unit
    batch_size: 1
    max_batch: 1
    partition: unit


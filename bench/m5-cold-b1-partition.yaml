# M5 follow-up: how large is the first-use cost that batching could amortize?
#
# The benchmark tool refuses cold + batch on purpose (cold measures first use;
# in a cold batch only the first item is cold). So this file varies the
# partition strategy at batch 1 only, under a verified-cold page cache, and is
# compared against the warm batch-1 row of the batch/partition matrix.
#
# If the cold-minus-warm gap is small, there is no I/O prize for batching to
# win in this environment and the tool does not need a cold-batch mode.
cold_base: &cold_base
  model: models/harrier-270m-q8_0.gguf
  corpus_group: mixed_short
  samples: 132
  normalize: true
  threads: 4
  streaming: true
  cache_state: cold
  batch_size: 1
  max_batch: 1
  milestones: [M5-COLD]

scenarios:
  - <<: *cold_base
    name: m5_cold_b01_layer
    partition: layer

  - <<: *cold_base
    name: m5_cold_b01_attn_ffn
    partition: attn-ffn

  - <<: *cold_base
    name: m5_cold_b01_budget10m
    partition: budget:10485760

  - <<: *cold_base
    name: m5_cold_b01_unit
    partition: unit

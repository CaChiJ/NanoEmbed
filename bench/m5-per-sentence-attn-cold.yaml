# 패킹 구현의 cold 효과를 재기 위한 축소 격자.
# 파티션은 layer 고정, 배치 크기만 바꾼다. bench/m5-cold-batch-partition-matrix.yaml
# 의 layer 열과 직접 비교할 수 있다.
cold_psa_base: &cold_psa_base
  model: models/harrier-270m-q8_0.gguf
  corpus_group: mixed_short
  samples: 132
  normalize: true
  threads: 4
  streaming: true
  cache_state: cold
  partition: layer
  milestones: [M5-PSA-COLD]

scenarios:
  - <<: *cold_psa_base
    name: m5_psa_cold_b01_layer
    batch_size: 1
    max_batch: 1

  - <<: *cold_psa_base
    name: m5_psa_cold_b02_layer
    batch_size: 2
    max_batch: 2

  - <<: *cold_psa_base
    name: m5_psa_cold_b03_layer
    batch_size: 3
    max_batch: 3

  - <<: *cold_psa_base
    name: m5_psa_cold_b04_layer
    batch_size: 4
    max_batch: 4

  - <<: *cold_psa_base
    name: m5_psa_cold_b05_layer
    batch_size: 5
    max_batch: 5

  - <<: *cold_psa_base
    name: m5_psa_cold_b10_layer
    batch_size: 10
    max_batch: 10

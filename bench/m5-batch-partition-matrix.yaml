# M5 follow-up: independent-variable sweep of true batch size and Linux
# streaming partition strategy.
#
# Performance is collected from a profile-off runner invocation. RSS/PSS/USS
# distributions are collected in a separate 10 ms profile-on invocation so
# profiler overhead is never reported as canonical latency.
matrix_base: &matrix_base
  model: models/harrier-270m-q8_0.gguf
  corpus_group: mixed_short
  samples: 132
  normalize: true
  threads: 4
  streaming: true
  cache_state: warm
  warmup: 1
  iter: 5
  milestones: [M5-MATRIX]

scenarios:
  - <<: *matrix_base
    name: m5_matrix_b01_layer
    batch_size: 1
    max_batch: 1
    partition: layer

  - <<: *matrix_base
    name: m5_matrix_b01_attn_ffn
    batch_size: 1
    max_batch: 1
    partition: attn-ffn

  - <<: *matrix_base
    name: m5_matrix_b01_budget10m
    batch_size: 1
    max_batch: 1
    partition: budget:10485760

  - <<: *matrix_base
    name: m5_matrix_b01_unit
    batch_size: 1
    max_batch: 1
    partition: unit


    warmup: 2
    iter: 5
    milestones: [M5, M6, M7, M8]

  - name: batch32_mixed_harrier_q8_streaming_control
    model: models/harrier-270m-q8_0.gguf
    corpus_group: mixed_short
    samples: 32
    batch_size: 32

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same PR / branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Release]

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # The accuracy tests (scanner / tokenizer / forward / golden / limits)
      # skip themselves without a model, which would make a green CI run
      # meaningless. Fetch it here and configure with NANOEMBED_REQUIRE_MODEL=ON
      # so a missing file fails the build instead of quietly skipping.
      - name: Cache model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models
          key: bge-small-en-v1.5-f16-gguf-v1

      - name: Download model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p models
          curl -fsSL -o models/bge-small-en-v1.5-f16.gguf \
            https://huggingface.co/CompendiumLabs/bge-small-en-v1.5-gguf/resolve/main/bge-small-en-v1.5-f16.gguf

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DNANOEMBED_REQUIRE_MODEL=ON

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke-test inspect tool
        run: |
          build/bin/nanoembed-inspect 2>&1 | grep -q "usage:" || exit 1
          build/bin/nanoembed-inspect models/bge-small-en-v1.5-f16.gguf | tee /dev/stderr \
            | grep -q "layers=12" || exit 1

      - name: Smoke-test CLI
        run: |
          echo "hello world" \
            | build/bin/nanoembed-cli models/bge-small-en-v1.5-f16.gguf \
            | grep -q "," || exit 1

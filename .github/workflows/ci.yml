name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded runs on the same PR / branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        build_type: [Release]

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke-test inspect tool (no GGUF — usage only)
        # Real GGUF inspection is gated on having a model file, which is
        # handled by the M3+ download/cache step. M1 only verifies the
        # binary exists and prints help.
        run: |
          if [ -x build/bin/nanoembed-inspect ]; then
            build/bin/nanoembed-inspect 2>&1 | grep -q "usage:" || exit 1
          else
            echo "nanoembed-inspect binary missing"; exit 1
          fi
